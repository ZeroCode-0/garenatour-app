name: app
description: "Garena Tour — player app. Powered by NeXdEvE."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # state
  flutter_riverpod: ^2.6.1

  # push notifications
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0

  # routing
  go_router: ^14.8.1

  # network
  dio: ^5.8.0

  # storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.5

  # ui
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.2.1
  flutter_animate: ^4.5.2
  flutter_svg: ^2.0.17

  # device / platform
  package_info_plus: ^8.3.0
  device_info_plus: ^11.3.0
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  image_picker: ^1.1.2

  # misc
  intl: ^0.20.2
  google_mobile_ads: ^9.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Rajdhani
      fonts:
        - asset: assets/fonts/Rajdhani-Medium.ttf
          weight: 500
        - asset: assets/fonts/Rajdhani-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Rajdhani-Bold.ttf
          weight: 700
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-Regular.ttf
          weight: 400
        - asset: assets/fonts/Sora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Sora-Bold.ttf
          weight: 700
