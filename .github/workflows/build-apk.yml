name: Build APK

# Free cloud build — no local disk needed.
# Push this repo to GitHub, then: Actions tab → Build APK → Run workflow.
# The signed-unsigned debug + release APKs are attached as artifacts.

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ['lib/**', 'pubspec.yaml', 'android/**', 'ios/**']

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release --split-per-abi

      - name: Build debug APK
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: garenatour-apk
          path: |
            build/app/outputs/flutter-apk/*.apk
          retention-days: 30
